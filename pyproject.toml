[project]
name = "productivity-tracker"
version = "0.1.0"
description = "Personal developer-productivity observatory: coding-agent tokens, GitHub, AWS and lavish pages in one event stream."
license = "MIT"
authors = [{ name = "nathan phillips", email = "nathanphillips369@hotmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pytz>=2026.3.post1",
    "pyyaml>=6.0",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
pt = "pt.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pt*"]

[tool.setuptools.package-data]
pt = ["store/queries/*.sql", "enrich/prices.yaml"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
    "boto3-stubs[ce,apprunner,s3]>=1.35",
]
# Tier-2 classifier and the weekly narrative call Claude — by default through
# the Claude Agent SDK on the subscription (CLAUDE_CODE_OAUTH_TOKEN), else the
# API SDK. Optional so the collectors and the demo image never need either.
enrich = ["anthropic>=0.40", "claude-agent-sdk>=0.2.131"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# B008: typer declares options as call defaults by design.
ignore = ["B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
